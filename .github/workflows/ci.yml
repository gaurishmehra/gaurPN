name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: relay (go test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: server/relay/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  desktop:
    name: desktop (go test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: desktop-client/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: cross-compile darwin/windows
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .

  android:
    name: android (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: install sdk packages + ndk
        run: |
          yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          NDK_PKG=$(sdkmanager --list | grep -oE 'ndk;2[78]\.[0-9]+(\.[0-9]+)*' | sort -V | tail -1)
          echo "Installing ${NDK_PKG}"
          yes | sdkmanager --install "${NDK_PKG}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_PKG#ndk;}" >> "$GITHUB_ENV"

      # tun2socks.aar is generated (not committed): build it with gomobile and
      # cache it keyed on the wrapper sources + calendar week (picks up
      # upstream outline-go-tun2socks moves at most weekly).
      - name: week stamp for cache key
        id: week
        run: echo "wk=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: cache tun2socks.aar
        id: aar
        uses: actions/cache@v4
        with:
          path: app/libs/tun2socks.aar
          key: aar-${{ steps.week.outputs.wk }}-${{ hashFiles('go/outlinev/**') }}

      - name: build tun2socks.aar
        if: steps.aar.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Jigsaw-Code/outline-go-tun2socks.git third_party/outline-go-tun2socks
          cd third_party/outline-go-tun2socks
          GOBIN=$PWD/bin go install golang.org/x/mobile/cmd/gomobile@latest
          GOBIN=$PWD/bin go install golang.org/x/mobile/cmd/gobind@latest
          ./bin/gomobile init
          cd ../../go/outlinev
          ../../third_party/outline-go-tun2socks/bin/gomobile bind \
            -target=android -androidapi 24 -ldflags '-w' \
            -o ../../app/libs/tun2socks.aar \
            -javapkg=dev.gaurish.outlinelite . \
            ../../third_party/outline-go-tun2socks/outline/tun2socks \
            ../../third_party/outline-go-tun2socks/outline/shadowsocks

      - name: unit tests
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest --console=plain

      - name: assemble debug apk
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --console=plain

      - name: upload apk on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
